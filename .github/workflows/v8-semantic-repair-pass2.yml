name: v8-semantic-repair-pass2

on:
  push:
    branches:
      - audit/main-v8-adversarial-hardening-20260903

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-pass2-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/main-v8-adversarial-hardening-20260903
          fetch-depth: 0
          persist-credentials: true
      - name: Apply second-pass semantic consistency repair
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "stock_agent/v8_main_discovery_coach.py",
              '''def _default_scanner(scanner_id: str, screened_count: int) -> dict[str, Any]:\n    return {\n        "scanner_id": scanner_id,\n        "scanner_source_sha256": V8_SCANNERS[scanner_id]["sha256"],\n        "execution_status": "COMPLETE",\n''',
              '''def _default_scanner(scanner_id: str, screened_count: int) -> dict[str, Any]:\n    # A default/fallback payload is schema-shaped absence of model evidence.\n    # It can never represent actual scanner execution.\n    return {\n        "scanner_id": scanner_id,\n        "scanner_source_sha256": V8_SCANNERS[scanner_id]["sha256"],\n        "execution_status": "PARTIAL",\n''',
          )

          replace_once(
              "stock_agent/v8_main_discovery_coach.py",
              '''                complete = (\n                    result.get("scanner_id") == scanner_id\n                    and result.get("scanner_source_sha256") == V8_SCANNERS[scanner_id]["sha256"]\n                    and result.get("execution_status") == "COMPLETE"\n                    and int(result.get("screened_count") or 0) == screened_count\n                    and result.get("grade_authority") is False\n                )\n                receipt = {\n                    "scanner_id": scanner_id,\n                    "scanner_name": V8_SCANNERS[scanner_id]["name"],\n                    "scanner_source_sha256": V8_SCANNERS[scanner_id]["sha256"],\n                    "model_call_executed": True,\n                    "execution_complete": complete,\n''',
              '''                contract_complete = (\n                    result.get("scanner_id") == scanner_id\n                    and result.get("scanner_source_sha256") == V8_SCANNERS[scanner_id]["sha256"]\n                    and result.get("execution_status") == "COMPLETE"\n                    and int(result.get("screened_count") or 0) == screened_count\n                    and result.get("grade_authority") is False\n                )\n                integrity_state = getattr(self, "_v8_integrity_state", {}).get(run.run_id) or {}\n                authoritative = (integrity_state.get("scanners") or {}).get(scanner_id) or {}\n                actual_execution = bool(\n                    authoritative.get("execution_status") == "SIGNAL_SCAN_COMPLETE"\n                    and authoritative.get("output_validated") is True\n                )\n                complete = bool(contract_complete and actual_execution)\n                receipt = {\n                    "scanner_id": scanner_id,\n                    "scanner_name": V8_SCANNERS[scanner_id]["name"],\n                    "scanner_source_sha256": V8_SCANNERS[scanner_id]["sha256"],\n                    "model_call_executed": actual_execution,\n                    "execution_complete": complete,\n''',
          )

          replace_once(
              "stock_agent/v8_pre_live_integrity_v20.py",
              '''def _default_scanner_v13(scanner_id: str, screened_count: int) -> dict[str, Any]:\n    value = integrity._integrity_default_scanner(scanner_id, screened_count)\n    value["coverage_ledger"] = []\n    value["output_contract_version"] = SCANNER_OUTPUT_CONTRACT_VERSION\n    return value\n''',
              '''def _default_scanner_v13(scanner_id: str, screened_count: int) -> dict[str, Any]:\n    value = integrity._integrity_default_scanner(scanner_id, screened_count)\n    value["coverage_ledger"] = []\n    value["output_contract_version"] = SCANNER_OUTPUT_CONTRACT_VERSION\n    value["execution_status"] = "PARTIAL"\n    value["source_exhaustion"] = False\n    value["source_exhaustion_reason"] = "DEFAULT_PAYLOAD_NOT_MODEL_EXECUTION"\n    return value\n''',
          )

          replace_once(
              "stock_agent/v8_pre_live_integrity_v20.py",
              '''def _provider_exhaustion_v20(store: Any, run_id: str, eligible: int) -> tuple[bool, dict[str, Any]]:\n    funnel = {str(row.get("funnel_stage")): row for row in store.list_funnel(run_id)}\n    def count(stage: str) -> int:\n        row = funnel.get(stage) or {}\n        return int(row.get("count") or 0)\n    raw = count("RAW_UNIVERSE")\n    adv_probed = count("ADV_PROBED")\n    adv_unknown = count("ADV_NOT_EVALUATED")\n    explicit_ceiling = adv_probed >= MIN_OPERATIONAL_PROBE\n    exhausted = bool(explicit_ceiling)\n    return exhausted, {\n        "raw_unique_ticker_coverage": raw,\n        "strategy_eligible_unique_coverage": int(eligible),\n        "adv_probed": adv_probed,\n        "adv_not_evaluated": adv_unknown,\n        "complete_verified_breadth": bool(adv_unknown == 0 and adv_probed >= raw and raw >= MIN_OPERATIONAL_PROBE),\n        "explicit_operational_ceiling": explicit_ceiling,\n        "minimum_operational_probe": MIN_OPERATIONAL_PROBE,\n        "small_fully_probed_subset_is_source_exhaustion": False,\n    }\n''',
              '''def _provider_exhaustion_v20(store: Any, run_id: str, eligible: int) -> tuple[bool, dict[str, Any]]:\n    funnel = {str(row.get("funnel_stage")): row for row in store.list_funnel(run_id)}\n    def count(stage: str) -> int:\n        row = funnel.get(stage) or {}\n        return int(row.get("count") or 0)\n    def details(stage: str) -> dict[str, Any]:\n        row = funnel.get(stage) or {}\n        raw_details = row.get("details_json")\n        if isinstance(raw_details, dict):\n            return raw_details\n        try:\n            parsed = json.loads(raw_details or "{}")\n        except (TypeError, ValueError):\n            return {}\n        return parsed if isinstance(parsed, dict) else {}\n\n    raw = count("RAW_UNIVERSE")\n    adv_probed = count("ADV_PROBED")\n    adv_unknown = count("ADV_NOT_EVALUATED")\n    eligible_count = max(0, int(eligible or 0))\n    scope = details("V8_4_UNIVERSE_SCOPE")\n    full_scope_validated = bool(\n        scope.get("full_scope_validated") is True\n        and str(scope.get("scope_claim") or "") == "FULL_STRATEGY_UNIVERSE_SCAN"\n    )\n    operational_probe_met = adv_probed >= MIN_OPERATIONAL_PROBE\n    denominator_reconciled = raw >= eligible_count\n    eligible_probe_complete = adv_probed >= eligible_count\n    exhausted = bool(\n        full_scope_validated\n        and denominator_reconciled\n        and eligible_probe_complete\n        and adv_unknown == 0\n    )\n    return exhausted, {\n        "raw_unique_ticker_coverage": raw,\n        "strategy_eligible_unique_coverage": eligible_count,\n        "adv_probed": adv_probed,\n        "adv_not_evaluated": adv_unknown,\n        "complete_verified_breadth": exhausted,\n        "explicit_operational_ceiling": operational_probe_met,\n        "minimum_operational_probe": MIN_OPERATIONAL_PROBE,\n        "operational_probe_threshold_is_source_exhaustion": False,\n        "full_scope_validated": full_scope_validated,\n        "denominator_reconciled": denominator_reconciled,\n        "eligible_probe_complete": eligible_probe_complete,\n        "search_debt_remains": not exhausted,\n        "small_fully_probed_subset_is_source_exhaustion": False,\n    }\n''',
          )

      - name: Commit semantic pass 2
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_agent/v8_main_discovery_coach.py stock_agent/v8_pre_live_integrity_v20.py
          git commit -m "[semantic-pass2-bot] Remove legacy execution and exhaustion contradictions"
          git push origin HEAD:audit/main-v8-adversarial-hardening-20260903
