name: hunt-resilience-v17-regression

on:
  pull_request:
    paths:
      - 'stock_agent/hunt_resilience_v17.py'
      - 'stock_agent/__main__.py'
      - 'tests/test_hunt_resilience_v17.py'
      - 'docs/v8_canonical/HUNT_RESILIENCE_V17.md'
      - '.github/workflows/hunt-resilience-v17-regression.yml'
  workflow_dispatch:

jobs:
  hunt-resilience-v17:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile V1.7 production and regression tests
        run: python -m py_compile stock_agent/hunt_resilience_v17.py tests/test_hunt_resilience_v17.py
      - name: Run V8 HUNT V1.7 resilience regression
        run: python -m unittest tests.test_hunt_resilience_v17 -v
