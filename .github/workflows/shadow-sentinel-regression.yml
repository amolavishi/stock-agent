name: shadow-sentinel-regression

on:
  pull_request:
    paths:
      - 'stock_agent/shadow_pointer_guard.py'
      - 'stock_agent/__init__.py'
      - 'tests/test_shadow_pointer_guard.py'
      - '.github/workflows/shadow-sentinel-regression.yml'
  workflow_dispatch:

jobs:
  sentinel-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile guard and regression
        run: python -m compileall -q stock_agent tests/test_shadow_pointer_guard.py
      - name: Reproduce and block legacy unstarted crash
        run: python -m unittest tests.test_shadow_pointer_guard -v
