name: apply-dxy-sync-group-hotfix

on:
  push:
    branches:
      - fix/dxy-sync-group-20260830

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxy-sync-group-20260830
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply source fix
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('stock_agent/adapters.py'); s=p.read_text(encoding='utf-8'); old='elif symbol == \"DXY\":\n                details.setdefault(\"sync_group\", \"exchange\")'; assert old in s; p.write_text(s.replace(old, old.replace('\"exchange\"','\"fx\"'), 1), encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('stock_agent/cli.py'); s=p.read_text(encoding='utf-8'); old='\"provider\", \"source_identifier\", \"value\"'; new='\"provider\", \"source_identifier\", \"sync_group\", \"value\"'; assert old in s; p.write_text(s.replace(old,new,1), encoding='utf-8')"
      - name: Verify full runtime
        shell: bash
        run: |
          python -m compileall -q stock_agent tests
          python -m unittest discover -s tests -q
          python STOCK_AGENT_OBSIDIAN_PROMPT_LIBRARY_V2_2/VALIDATION/validate_contracts.py
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_agent/adapters.py stock_agent/cli.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix DXY adapter sync group [hotfix-applied]"
          git push origin HEAD:fix/dxy-sync-group-20260830
