name: stock-agent-ci
# Read-only CI: source, credentials, and validation reports are never mutated.

on:
  push:
    branches:
      - repair/authoritative-live-hunt-p0-p1-20260820
      - repair/chatgpt-adversarial-hardening-20260820
      - "audit/**"
  pull_request:
    branches:
      - main
      - repair/authoritative-live-hunt-p0-p1-20260820

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile production and tests
        run: python -m compileall -q stock_agent tests
      - name: Run full unittest suite
        run: python -m unittest discover -s tests -q
      - name: Validate Prompt Library contracts (read-only)
        if: always()
        run: python STOCK_AGENT_OBSIDIAN_PROMPT_LIBRARY_V2_2/VALIDATION/validate_contracts.py
      - name: Verify validation did not mutate tracked files
        if: always()
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
