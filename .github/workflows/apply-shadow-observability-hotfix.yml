name: apply-shadow-observability-hotfix

on:
  push:
    branches:
      - fix/shadow-observability-20260830

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shadow-observability-20260830
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply source fix
        run: python tools/apply_shadow_observability_hotfix.py
      - name: Verify full runtime
        run: |
          python -m compileall -q stock_agent tests
          python -m unittest discover -s tests -q
          python STOCK_AGENT_OBSIDIAN_PROMPT_LIBRARY_V2_2/VALIDATION/validate_contracts.py
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_agent/runtime.py stock_agent/shadow.py tests/test_shadow_observability.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Shadow incident attribution and stage export [hotfix-applied]"
          git push origin HEAD:fix/shadow-observability-20260830
