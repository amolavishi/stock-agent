name: adversarial-audit

on:
  push:
    branches:
      - agent/adversarial-ci-3ad864f
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -q stock_agent tests main.py mcp_server.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Secret scan
        if: always()
        run: python -c "from stock_agent.secret_scan import scan_tree; findings=scan_tree('.'); print('secret_findings=', len(findings)); [print(f) for f in findings]; raise SystemExit(1 if findings else 0)"
