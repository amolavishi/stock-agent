name: v8-test-truth-repair

on:
  push:
    branches:
      - audit/main-v8-adversarial-hardening-20260903

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[test-truth-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/main-v8-adversarial-hardening-20260903
          fetch-depth: 0
          persist-credentials: true
      - name: Replace wrong source-exhaustion expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/test_v8_pre_live_integrity_v20.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def test_explicit_1000_name_operational_probe_can_document_exhaustion_boundary(self):\n        store = FunnelStore([\n            {"funnel_stage": "RAW_UNIVERSE", "count": 3000},\n            {"funnel_stage": "ADV_PROBED", "count": MIN_OPERATIONAL_PROBE},\n            {"funnel_stage": "ADV_NOT_EVALUATED", "count": 2000},\n        ])\n        exhausted, details = _provider_exhaustion_v20(store, "RUN", 600)\n        self.assertTrue(exhausted)\n        self.assertTrue(details["explicit_operational_ceiling"])\n'''
          new = '''    def test_explicit_1000_name_operational_probe_is_not_source_exhaustion_with_unresolved_debt(self):\n        store = FunnelStore([\n            {"funnel_stage": "RAW_UNIVERSE", "count": 3000},\n            {"funnel_stage": "ADV_PROBED", "count": MIN_OPERATIONAL_PROBE},\n            {"funnel_stage": "ADV_NOT_EVALUATED", "count": 2000},\n            {"funnel_stage": "V8_4_UNIVERSE_SCOPE", "count": 3000, "details_json": json.dumps({\n                "scope_claim": "FULL_STRATEGY_UNIVERSE_SCAN",\n                "full_scope_validated": True,\n            })},\n        ])\n        exhausted, details = _provider_exhaustion_v20(store, "RUN", 600)\n        self.assertFalse(exhausted)\n        self.assertTrue(details["explicit_operational_ceiling"])\n        self.assertFalse(details["operational_probe_threshold_is_source_exhaustion"])\n        self.assertTrue(details["search_debt_remains"])\n'''
          if text.count(old) != 1:
              raise SystemExit(f"wrong-semantics target count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit corrected test truth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v8_pre_live_integrity_v20.py
          git commit -m "[test-truth-bot] Reject false 1000-probe source exhaustion"
          git push origin HEAD:audit/main-v8-adversarial-hardening-20260903
