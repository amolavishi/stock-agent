name: v8-semantic-repair-pass3

on:
  push:
    branches:
      - audit/main-v8-adversarial-hardening-20260903

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-pass3-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/main-v8-adversarial-hardening-20260903
          fetch-depth: 0
          persist-credentials: true
      - name: Apply fallback and production-composition repair
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "stock_agent/v8_main_discovery_integrity.py",
              '''def _integrity_default_scanner(scanner_id: str, screened_count: int) -> dict[str, Any]:\n    value = _ORIGINAL_DEFAULT_SCANNER(scanner_id, screened_count)\n    value.update({\n        "output_contract_version": SCANNER_OUTPUT_CONTRACT_VERSION,\n''',
              '''def _integrity_default_scanner(scanner_id: str, screened_count: int) -> dict[str, Any]:\n    value = _ORIGINAL_DEFAULT_SCANNER(scanner_id, screened_count)\n    # Compatibility wrapping must never upgrade an absence-of-model-evidence\n    # fallback into a completed execution receipt.\n    value["execution_status"] = "PARTIAL"\n    value.update({\n        "output_contract_version": SCANNER_OUTPUT_CONTRACT_VERSION,\n''',
          )

          replace_once(
              "stock_agent/v8_pre_live_integrity_v20.py",
              '''def _default_scanner_v13(scanner_id: str, screened_count: int) -> dict[str, Any]:\n    value = integrity._integrity_default_scanner(scanner_id, screened_count)\n''',
              '''def _default_scanner_v13(scanner_id: str, screened_count: int) -> dict[str, Any]:\n    # Call the captured pre-install implementation, not the module attribute\n    # that this installer replaces with this wrapper. This prevents recursion\n    # and makes installer order deterministic.\n    value = _BASE_INTEGRITY_DEFAULT_SCANNER(scanner_id, screened_count)\n''',
          )

          replace_once(
              "stock_agent/v8_pre_live_integrity_v20.py",
              '''_BASE_CONTRACT_COMPLETE = integrity._contract_complete\n_BASE_ROUND_METRICS = integrity._round_metrics\n_BASE_ATOMIC_FINALIZER = next_runtime._finalize_atomic_audit\n''',
              '''_BASE_INTEGRITY_DEFAULT_SCANNER = integrity._integrity_default_scanner\n_BASE_CONTRACT_COMPLETE = integrity._contract_complete\n_BASE_ROUND_METRICS = integrity._round_metrics\n_BASE_ATOMIC_FINALIZER = next_runtime._finalize_atomic_audit\n''',
          )

          replace_once(
              "stock_agent/bootstrap.py",
              '''    from .v8_pre_live_integrity_v201 import V8_PRE_LIVE_INTEGRITY_PATCH_VERSION\n\n    cls = runtime.ProductionStockAgent\n    mro = [f"{item.__module__}.{item.__name__}" for item in cls.__mro__]\n    return {\n''',
              '''    from .v8_pre_live_integrity_v201 import V8_PRE_LIVE_INTEGRITY_PATCH_VERSION\n    from .models import canonical_hash\n\n    cls = runtime.ProductionStockAgent\n    mro = [f"{item.__module__}.{item.__name__}" for item in cls.__mro__]\n    composition = {\n''',
          )

          replace_once(
              "stock_agent/bootstrap.py",
              '''        "shadow_non_evaluable_guard_version": getattr(shadow.DailyShadowRunner, "shadow_non_evaluable_guard_version", None),\n    }\n''',
              '''        "shadow_non_evaluable_guard_version": getattr(shadow.DailyShadowRunner, "shadow_non_evaluable_guard_version", None),\n    }\n    version_vector = {\n        "runtime_module": composition["runtime_module"],\n        "runtime_class": composition["runtime_class"],\n        "v8_policy_version": composition["v8_policy_version"],\n        "v8_ruleset_hash": composition["v8_ruleset_hash"],\n        "v8_semantic_core_version": composition["v8_semantic_core_version"],\n        "v8_system_semantics_version": composition["v8_system_semantics_version"],\n        "v8_discovery_source_package_version": composition["v8_discovery_source_package_version"],\n        "v8_source_identity_guard_version": composition["v8_source_identity_guard_version"],\n    }\n    composition["production_version_vector"] = version_vector\n    composition["canonical_production_entrypoint"] = (\n        composition["runtime_class"] == "V8PreLiveSentinelProductionStockAgent"\n        and composition["main_is_sole_discovery_owner"] is True\n        and composition["discovery_recall_lite_runtime_installed"] is False\n    )\n    composition["production_composition_valid"] = bool(\n        composition["canonical_production_entrypoint"]\n        and composition["v8_source_bundle"].get("complete") is True\n        and composition["v8_source_identity_guard"].get("complete") is True\n    )\n    composition["production_composition_hash"] = canonical_hash({\n        "mro": mro,\n        "version_vector": version_vector,\n        "canonical_production_entrypoint": composition["canonical_production_entrypoint"],\n    })\n    return composition\n''',
          )

      - name: Commit semantic pass 3
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_agent/v8_main_discovery_integrity.py stock_agent/v8_pre_live_integrity_v20.py stock_agent/bootstrap.py
          git commit -m "[semantic-pass3-bot] Make fallback and production composition deterministic"
          git push origin HEAD:audit/main-v8-adversarial-hardening-20260903
