name: alpha-discovery-regression

on:
  pull_request:
    paths:
      - "stock_agent/alpha_bootstrap.py"
      - "stock_agent/__main__.py"
      - "tests/test_alpha_discovery_policy.py"
      - ".github/workflows/alpha-discovery-regression.yml"
  workflow_dispatch:

jobs:
  alpha-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile production alpha policy
        run: python -m compileall -q stock_agent tests/test_alpha_discovery_policy.py
      - name: Run alpha discovery regression
        run: python -m unittest tests.test_alpha_discovery_policy -v
