name: hunt-integrity-v18-regression

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostile-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile integrity paths
        run: python -m compileall -q stock_agent tests
      - name: Run V1.8 hostile integrity regressions
        run: python -m unittest -q tests.test_hunt_integrity_v18_hostile tests.test_hunt_stage_failure_semantics_v18 tests.test_pre_a_sidecar tests.test_pre_a_source_v2 tests.test_false_negative_audit
      - name: Verify prompt contracts remain immutable
        run: python STOCK_AGENT_OBSIDIAN_PROMPT_LIBRARY_V2_2/VALIDATION/validate_contracts.py
      - name: Verify tests did not mutate tracked files
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
