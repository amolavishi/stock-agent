name: Sync latest Shadow source

on:
  push:
    branches:
      - agent/shadow-acceptance-fix-20260830
    paths:
      - bootstrap/latest_shadow_source.b64

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decode latest source package
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/latest_shadow_source.b64 > /tmp/latest-shadow.zip
          echo "79d3e07d969507fafc5b495939117ace0f81a4e7f7072030258b8348ed326093  /tmp/latest-shadow.zip" | sha256sum -c -

      - name: Replace branch tree with latest Shadow source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name bootstrap \
            -exec rm -rf {} +
          unzip -q /tmp/latest-shadow.zip -d .
          rm -rf bootstrap

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Stock Agent Sync"
          git config user.email "stock-agent-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Sync latest Primary Shadow source and verified acceptance fixes"
          git push origin HEAD:agent/shadow-acceptance-fix-20260830
