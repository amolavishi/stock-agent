name: apply-market-context-hotfix

on:
  push:
    branches:
      - fix/market-context-fx-shadow-status-20260830

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-context-fx-shadow-status-20260830
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply correctness hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gates = Path('stock_agent/gates.py')
          text = gates.read_text(encoding='utf-8')
          old = '''                if group in {"exchange", "fx"} and observed_dt.date() < latest_session_date:\n                    invalid_assets.append(selected)\n                    continue\n'''
          new = '''                # Exchange-session assets must belong to the latest completed U.S.\n                # equity session. FX observations use their own clock and can\n                # legitimately lag the U.S. equity session date (for example,\n                # Yahoo DXY daily bars over a weekend) while still satisfying\n                # the stricter FX max-age and intra-group synchronization rules.\n                if group == "exchange" and observed_dt.date() < latest_session_date:\n                    invalid_assets.append(selected)\n                    continue\n'''
          if old not in text:
              raise SystemExit('gates.py target not found')
          gates.write_text(text.replace(old, new, 1), encoding='utf-8')

          shadow = Path('stock_agent/shadow.py')
          text = shadow.read_text(encoding='utf-8')
          text = text.replace('SHADOW_VERSION = "SHADOW_V1.1"', 'SHADOW_VERSION = "SHADOW_V1.2"', 1)
          old = '''                if hunt.outcome.startswith("BLOCKED"):\n                    errors.append({"component": "HUNT", "error": hunt.blocked_reason or hunt.outcome})\n                elif hunt.outcome == "QUALIFIED_CANDIDATE_POOL":\n'''
          new = '''                if hunt.outcome.startswith("BLOCKED"):\n                    errors.append({"component": "HUNT", "error": hunt.blocked_reason or hunt.outcome})\n                elif hunt.outcome == "NO_QUALIFIED_CANDIDATE" and hunt.blocked_reason:\n                    # A deterministic pre-discovery evidence/data gate is not a\n                    # clean "no opportunity" result. Preserve the authoritative\n                    # no-candidate outcome, but degrade Shadow operational status\n                    # so an operator cannot mistake a blocked scan for a completed\n                    # broad hunt. Market/universe blocks are attributed to MARKET.\n                    component = "MARKET" if hunt.blocked_reason in {"MARKET_CONTEXT_GATE", "UNIVERSE_FILTER"} else "HUNT"\n                    errors.append({\n                        "component": component,\n                        "error": hunt.blocked_reason,\n                        "classification": "PRE_DISCOVERY_BLOCK",\n                    })\n                elif hunt.outcome == "QUALIFIED_CANDIDATE_POOL":\n'''
          if old not in text:
              raise SystemExit('shadow.py hunt target not found')
          text = text.replace(old, new, 1)
          old = '''            component_errors = {str(error.get("component") or "").upper() for error in errors}\n            if hunt_run_id and "HUNT" not in component_errors:\n                health["market"] = {**dict(health.get("market") or {}), "status": "PASS"}\n                health["evidence"] = {**dict(health.get("evidence") or {}), "status": "PASS"}\n                health["gate_integrity"] = {**dict(health.get("gate_integrity") or {}), "status": "PASS"}\n            if "SEC" not in component_errors:\n                health["sec"] = {**dict(health.get("sec") or {}), "status": "PASS"}\n            if "RESEARCH" not in component_errors:\n                health["research"] = {**dict(health.get("research") or {}), "status": "PASS"}\n            if execution_run_id and "EXECUTION_REVIEW" not in component_errors:\n                health["portfolio"] = {**dict(health.get("portfolio") or {}), "status": "PASS"}\n'''
          new = '''            component_errors = {str(error.get("component") or "").upper() for error in errors}\n            funnel_rows = self.store.list_funnel(hunt_run_id) if hunt_run_id else []\n            funnel = {str(row["funnel_stage"]): int(row["count"]) for row in funnel_rows}\n            market_gate_observed = "MARKET_CONTEXT_GATE" in funnel\n            market_gate_passed = funnel.get("MARKET_CONTEXT_GATE", 0) == 1\n            if hunt_run_id and "HUNT" not in component_errors and "MARKET" not in component_errors and market_gate_passed:\n                health["market"] = {**dict(health.get("market") or {}), "status": "PASS"}\n                health["evidence"] = {**dict(health.get("evidence") or {}), "status": "PASS"}\n                health["gate_integrity"] = {**dict(health.get("gate_integrity") or {}), "status": "PASS"}\n            elif market_gate_observed and not market_gate_passed:\n                health["market"] = {**dict(health.get("market") or {}), "status": "DEGRADED"}\n\n            # Do not report SEC/Research PASS merely because those providers\n            # were never reached. Mark PASS only when the corresponding live\n            # evidence path actually executed without a provider/data failure.\n            sec_reached = any(funnel.get(key, 0) > 0 for key in (\n                "CAPITAL_PRESCREEN_PASS", "CAPITAL_PRESCREEN_FAIL",\n                "CAPITAL_PRESCREEN_UNKNOWN", "FULL_SEC_FORENSIC",\n                "SEC_PROVIDER_FAILURE", "SEC_STALE_DATA",\n            ))\n            research_reached = any(funnel.get(key, 0) > 0 for key in (\n                "CATALYST_PASS", "CATALYST_UNKNOWN", "CATALYST_NOT_EVALUATED",\n                "DEEP_RESEARCH", "RESEARCH_PROVIDER_FAILURE",\n            ))\n            if sec_reached and "SEC" not in component_errors:\n                health["sec"] = {**dict(health.get("sec") or {}), "status": "PASS"}\n            elif not sec_reached and "SEC" not in component_errors:\n                health["sec"] = {**dict(health.get("sec") or {}), "status": "NOT_RUN"}\n            if research_reached and "RESEARCH" not in component_errors:\n                health["research"] = {**dict(health.get("research") or {}), "status": "PASS"}\n            elif not research_reached and "RESEARCH" not in component_errors:\n                health["research"] = {**dict(health.get("research") or {}), "status": "NOT_RUN"}\n            if execution_run_id and "EXECUTION_REVIEW" not in component_errors:\n                health["portfolio"] = {**dict(health.get("portfolio") or {}), "status": "PASS"}\n            elif not execution_run_id and "EXECUTION_REVIEW" not in component_errors:\n                health["portfolio"] = {**dict(health.get("portfolio") or {}), "status": "NOT_RUN"}\n'''
          if old not in text:
              raise SystemExit('shadow.py health target not found')
          text = text.replace(old, new, 1)
          old = '''                "status": (\n                    "PASS"\n                    if hunt_run.outcome == "QUALIFIED_CANDIDATE_POOL" and sum(workitems.get(hunt_run_id, {}).values()) == 11\n                    else "SUCCEEDED_NO_CANDIDATE"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE" and broad_discovery\n                    else "NO_OPPORTUNITY_BOUNDED"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE"\n                    else "FAILED"\n                ),\n'''
          new = '''                "status": (\n                    "PASS"\n                    if hunt_run.outcome == "QUALIFIED_CANDIDATE_POOL" and sum(workitems.get(hunt_run_id, {}).values()) == 11\n                    else "BLOCKED_MARKET_CONTEXT"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE"\n                    and funnel.get("MARKET_CONTEXT_GATE") == 0\n                    and "RAW_UNIVERSE" not in funnel\n                    else "SUCCEEDED_NO_CANDIDATE"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE" and broad_discovery\n                    else "NO_OPPORTUNITY_BOUNDED"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE"\n                    else "FAILED"\n                ),\n'''
          if old not in text:
              raise SystemExit('shadow.py log target not found')
          shadow.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_market_context_shadow_hotfix_20260830.py')
          test.write_text(r'''from __future__ import annotations

import json
import tempfile
import unittest
from datetime import datetime, timezone
from pathlib import Path
from types import SimpleNamespace

from stock_agent.adapters import _market_asset_observation, deterministic_market_context_from_payload
from stock_agent.gates import GateDecision, MarketContextGate
from stock_agent.models import EffectiveRuleSet
from stock_agent.shadow import DailyShadowRunner
from stock_agent.store import SQLiteStore


def _asset(symbol: str, observed_at: str):
    unit = {
        "SPY": "USD_PER_SHARE", "QQQ": "USD_PER_SHARE", "IWM": "USD_PER_SHARE",
        "SOXX": "USD_PER_SHARE", "WTI": "USD_PER_BARREL", "BTC": "USD_PER_COIN",
        "ETH": "USD_PER_COIN", "US10Y": "PERCENT",
    }.get(symbol, "INDEX_POINTS")
    currency = "USD" if unit.startswith("USD_") else None
    return _market_asset_observation(
        symbol=symbol, provider="fixture", source_identifier=f"https://example.test/{symbol}",
        payload={"observations": [{"timestamp": observed_at, "value": 1.0}, {"timestamp": observed_at, "value": 1.1}]},
        values=[1.0, 1.1], observed_at=observed_at, unit=unit, currency=currency,
    )


def _weekend_context():
    timestamps = {
        "SPY": "2026-08-28T20:00:00Z", "QQQ": "2026-08-28T20:00:00Z",
        "IWM": "2026-08-28T20:00:00Z", "SOXX": "2026-08-28T20:00:00Z",
        "VIX": "2026-08-27T00:00:00Z", "US10Y": "2026-08-27T00:00:00Z",
        "DXY": "2026-08-27T04:00:00Z", "WTI": "2026-08-25T00:00:00Z",
        "BTC": "2026-08-30T11:49:50Z", "ETH": "2026-08-30T11:49:40Z",
    }
    observations = [_asset(symbol, observed) for symbol, observed in timestamps.items()]
    context = deterministic_market_context_from_payload(observations)
    context["source"] = [{k: v for k, v in item.items() if k != "_raw_artifact"} for item in observations]
    groups = {
        "SPY": "exchange", "QQQ": "exchange", "IWM": "exchange", "SOXX": "exchange",
        "VIX": "daily", "US10Y": "daily", "WTI": "daily", "DXY": "fx",
        "BTC": "crypto", "ETH": "crypto",
    }
    for item in observations:
        context["assets"][item["symbol"]].update({k: v for k, v in item.items() if k not in {"payload", "_raw_artifact"}})
        context["assets"][item["symbol"]]["sync_group"] = groups[item["symbol"]]
    return context


class MarketContextShadowHotfixTests(unittest.TestCase):
    def test_dxy_one_business_day_lag_uses_fx_freshness_not_equity_session_date(self):
        receipt = MarketContextGate().evaluate(
            _weekend_context(), EffectiveRuleSet(),
            evaluation_time=datetime(2026, 8, 30, 11, 51, tzinfo=timezone.utc),
        )
        self.assertEqual(receipt.decision, GateDecision.PASS)

    def test_exchange_asset_still_requires_latest_completed_equity_session(self):
        context = _weekend_context()
        context["assets"]["SPY"]["observed_at"] = "2026-08-27T20:00:00Z"
        receipt = MarketContextGate().evaluate(
            context, EffectiveRuleSet(),
            evaluation_time=datetime(2026, 8, 30, 11, 51, tzinfo=timezone.utc),
        )
        self.assertEqual(receipt.decision, GateDecision.INSUFFICIENT_EVIDENCE)

    def test_pre_discovery_market_block_is_degraded_not_clean_success(self):
        store = SQLiteStore(":memory:")

        class BlockedAgent:
            def __init__(self, target_store):
                self.store = target_store

            def run(self, mode, data):
                run = self.store.create_run(mode, EffectiveRuleSet(), "market-block-context", self.store.current_evidence_epoch())
                self.store.record_funnel(run.run_id, "MARKET_CONTEXT_GATE", 0, {"core_input_complete": False})
                self.store.finish_run(run.run_id, "NO_QUALIFIED_CANDIDATE")
                return SimpleNamespace(run_id=run.run_id, outcome="NO_QUALIFIED_CANDIDATE", blocked_reason="MARKET_CONTEXT_GATE")

        metadata = {
            "code_git_sha": "a" * 40, "branch": "test", "ruleset_hash": "rules",
            "prompt_library_hash": "prompt", "config_hash": "config", "model": "recorded",
            "provider": "recorded", "reasoning_effort": {"BALANCED": "medium"},
            "schema_version": "shadow-log-v1", "database_schema_version": "shadow-v1",
            "timezone": "Asia/Seoul", "broker_write_count": 0,
        }
        with tempfile.TemporaryDirectory() as temp:
            runner = DailyShadowRunner(BlockedAgent(store), temp, metadata, provider_health=lambda: {"status": "PASS"})
            result = runner.run({}, run_date="2026-08-30")
            self.assertEqual(result.status, "DEGRADED")
            log = json.loads(Path(result.artifact_paths["RUN_LOG"]).read_text(encoding="utf-8"))
            self.assertEqual(log["hunt_contract"]["status"], "BLOCKED_MARKET_CONTEXT")
            self.assertEqual(log["providers"]["market"]["status"], "DEGRADED")
            self.assertEqual(log["providers"]["sec"]["status"], "NOT_RUN")
            self.assertEqual(log["providers"]["research"]["status"], "NOT_RUN")
            self.assertEqual(log["providers"]["portfolio"]["status"], "NOT_RUN")
            self.assertTrue(any(error.get("classification") == "PRE_DISCOVERY_BLOCK" for error in log["errors"]))
            self.assertEqual(log["broker_write_count"], 0)
        store.close()


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY
      - name: Verify full runtime
        shell: bash
        run: |
          python -m compileall -q stock_agent tests
          python -m unittest discover -s tests -q
          python STOCK_AGENT_OBSIDIAN_PROMPT_LIBRARY_V2_2/VALIDATION/validate_contracts.py
      - name: Commit applied hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_agent/gates.py stock_agent/shadow.py tests/test_market_context_shadow_hotfix_20260830.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix market-context FX clock and Shadow status [hotfix-applied]"
          git push origin HEAD:fix/market-context-fx-shadow-status-20260830
