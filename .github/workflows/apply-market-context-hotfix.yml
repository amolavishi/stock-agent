name: apply-market-context-hotfix

on:
  push:
    branches:
      - fix/market-context-fx-shadow-status-20260830

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-context-fx-shadow-status-20260830
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Apply source hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gates = Path('stock_agent/gates.py')
          text = gates.read_text(encoding='utf-8')
          old = '                if group in {"exchange", "fx"} and observed_dt.date() < latest_session_date:\n                    invalid_assets.append(selected)\n                    continue\n'
          new = '                # Exchange-session assets must belong to the latest completed U.S.\n                # equity session. FX observations use their own clock and can\n                # legitimately lag the U.S. equity session date while still\n                # satisfying FX max-age and synchronization rules.\n                if group == "exchange" and observed_dt.date() < latest_session_date:\n                    invalid_assets.append(selected)\n                    continue\n'
          if old in text:
              gates.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'if group == "exchange" and observed_dt.date() < latest_session_date:' not in text:
              raise SystemExit('gates.py target not found')

          shadow = Path('stock_agent/shadow.py')
          text = shadow.read_text(encoding='utf-8')
          text = text.replace('SHADOW_VERSION = "SHADOW_V1.1"', 'SHADOW_VERSION = "SHADOW_V1.2"', 1)

          old = '                if hunt.outcome.startswith("BLOCKED"):\n                    errors.append({"component": "HUNT", "error": hunt.blocked_reason or hunt.outcome})\n                elif hunt.outcome == "QUALIFIED_CANDIDATE_POOL":\n'
          new = '                if hunt.outcome.startswith("BLOCKED"):\n                    errors.append({"component": "HUNT", "error": hunt.blocked_reason or hunt.outcome})\n                elif hunt.outcome == "NO_QUALIFIED_CANDIDATE" and hunt.blocked_reason:\n                    component = "MARKET" if hunt.blocked_reason in {"MARKET_CONTEXT_GATE", "UNIVERSE_FILTER"} else "HUNT"\n                    errors.append({"component": component, "error": hunt.blocked_reason, "classification": "PRE_DISCOVERY_BLOCK"})\n                elif hunt.outcome == "QUALIFIED_CANDIDATE_POOL":\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'classification": "PRE_DISCOVERY_BLOCK"' not in text:
              raise SystemExit('shadow hunt target not found')

          old = '            component_errors = {str(error.get("component") or "").upper() for error in errors}\n            if hunt_run_id and "HUNT" not in component_errors:\n                health["market"] = {**dict(health.get("market") or {}), "status": "PASS"}\n                health["evidence"] = {**dict(health.get("evidence") or {}), "status": "PASS"}\n                health["gate_integrity"] = {**dict(health.get("gate_integrity") or {}), "status": "PASS"}\n            if "SEC" not in component_errors:\n                health["sec"] = {**dict(health.get("sec") or {}), "status": "PASS"}\n            if "RESEARCH" not in component_errors:\n                health["research"] = {**dict(health.get("research") or {}), "status": "PASS"}\n            if execution_run_id and "EXECUTION_REVIEW" not in component_errors:\n                health["portfolio"] = {**dict(health.get("portfolio") or {}), "status": "PASS"}\n'
          new = '            component_errors = {str(error.get("component") or "").upper() for error in errors}\n            funnel_rows = self.store.list_funnel(hunt_run_id) if hunt_run_id else []\n            funnel = {str(row["funnel_stage"]): int(row["count"]) for row in funnel_rows}\n            market_gate_observed = "MARKET_CONTEXT_GATE" in funnel\n            market_gate_passed = funnel.get("MARKET_CONTEXT_GATE", 0) == 1\n            if hunt_run_id and "HUNT" not in component_errors and "MARKET" not in component_errors and market_gate_passed:\n                health["market"] = {**dict(health.get("market") or {}), "status": "PASS"}\n                health["evidence"] = {**dict(health.get("evidence") or {}), "status": "PASS"}\n                health["gate_integrity"] = {**dict(health.get("gate_integrity") or {}), "status": "PASS"}\n            elif market_gate_observed and not market_gate_passed:\n                health["market"] = {**dict(health.get("market") or {}), "status": "DEGRADED"}\n            sec_reached = any(funnel.get(key, 0) > 0 for key in ("CAPITAL_PRESCREEN_PASS", "CAPITAL_PRESCREEN_FAIL", "CAPITAL_PRESCREEN_UNKNOWN", "FULL_SEC_FORENSIC", "SEC_PROVIDER_FAILURE", "SEC_STALE_DATA"))\n            research_reached = any(funnel.get(key, 0) > 0 for key in ("CATALYST_PASS", "CATALYST_UNKNOWN", "CATALYST_NOT_EVALUATED", "DEEP_RESEARCH", "RESEARCH_PROVIDER_FAILURE"))\n            if sec_reached and "SEC" not in component_errors:\n                health["sec"] = {**dict(health.get("sec") or {}), "status": "PASS"}\n            elif not sec_reached and "SEC" not in component_errors:\n                health["sec"] = {**dict(health.get("sec") or {}), "status": "NOT_RUN"}\n            if research_reached and "RESEARCH" not in component_errors:\n                health["research"] = {**dict(health.get("research") or {}), "status": "PASS"}\n            elif not research_reached and "RESEARCH" not in component_errors:\n                health["research"] = {**dict(health.get("research") or {}), "status": "NOT_RUN"}\n            if execution_run_id and "EXECUTION_REVIEW" not in component_errors:\n                health["portfolio"] = {**dict(health.get("portfolio") or {}), "status": "PASS"}\n            elif not execution_run_id and "EXECUTION_REVIEW" not in component_errors:\n                health["portfolio"] = {**dict(health.get("portfolio") or {}), "status": "NOT_RUN"}\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'market_gate_observed = "MARKET_CONTEXT_GATE" in funnel' not in text:
              raise SystemExit('shadow health target not found')

          old = '                "status": (\n                    "PASS"\n                    if hunt_run.outcome == "QUALIFIED_CANDIDATE_POOL" and sum(workitems.get(hunt_run_id, {}).values()) == 11\n                    else "SUCCEEDED_NO_CANDIDATE"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE" and broad_discovery\n                    else "NO_OPPORTUNITY_BOUNDED"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE"\n                    else "FAILED"\n                ),\n'
          new = '                "status": (\n                    "PASS"\n                    if hunt_run.outcome == "QUALIFIED_CANDIDATE_POOL" and sum(workitems.get(hunt_run_id, {}).values()) == 11\n                    else "BLOCKED_MARKET_CONTEXT"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE" and funnel.get("MARKET_CONTEXT_GATE") == 0 and "RAW_UNIVERSE" not in funnel\n                    else "SUCCEEDED_NO_CANDIDATE"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE" and broad_discovery\n                    else "NO_OPPORTUNITY_BOUNDED"\n                    if hunt_run.outcome == "NO_QUALIFIED_CANDIDATE"\n                    else "FAILED"\n                ),\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif '"BLOCKED_MARKET_CONTEXT"' not in text:
              raise SystemExit('shadow log target not found')
          shadow.write_text(text, encoding='utf-8')
          PY
      - name: Verify full runtime
        shell: bash
        run: |
          python -m compileall -q stock_agent tests
          python -m unittest discover -s tests -q
          python STOCK_AGENT_OBSIDIAN_PROMPT_LIBRARY_V2_2/VALIDATION/validate_contracts.py
      - name: Commit source hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_agent/gates.py stock_agent/shadow.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix market-context FX clock and Shadow status [hotfix-applied]"
          git push origin HEAD:fix/market-context-fx-shadow-status-20260830
