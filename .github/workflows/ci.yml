name: stock-agent-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate tracked UTF-8 sources
        run: python scripts/validate_tracked_sources.py
      - name: Compile production and test sources
        run: python -m compileall -q stock_agent tests main.py mcp_server.py
      - name: Run full unittest suite
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Run tracked secret scan
        run: python scripts/secret_scan_tracked.py
