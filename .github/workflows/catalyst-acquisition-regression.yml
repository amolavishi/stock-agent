name: catalyst-acquisition-regression

on:
  pull_request:
    paths:
      - 'stock_agent/catalyst_acquisition_v15.py'
      - 'stock_agent/__main__.py'
      - 'tests/test_catalyst_acquisition_v15.py'
      - '.github/workflows/catalyst-acquisition-regression.yml'
  workflow_dispatch:

jobs:
  catalyst-acquisition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile catalyst acquisition layer
        run: python -m py_compile stock_agent/catalyst_acquisition_v15.py tests/test_catalyst_acquisition_v15.py
      - name: Run catalyst acquisition regression
        run: python -m unittest tests.test_catalyst_acquisition_v15 -v
