name: hunt-pipeline-v16-regression

on:
  pull_request:
    paths:
      - 'stock_agent/hunt_pipeline_v16.py'
      - 'stock_agent/__main__.py'
      - 'tests/test_hunt_pipeline_v16.py'
      - 'docs/v8_canonical/HUNT_PIPELINE_V16_DESIGN.md'
      - '.github/workflows/hunt-pipeline-v16-regression.yml'
  workflow_dispatch:

jobs:
  hunt-pipeline-v16:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile V1.6 production and regression tests
        run: python -m py_compile stock_agent/hunt_pipeline_v16.py tests/test_hunt_pipeline_v16.py
      - name: Run V8 HUNT V1.6 regression
        run: python -m unittest tests.test_hunt_pipeline_v16 -v
